[workspace]
resolver = "2"
members = ["crates/silk-decoder", "crates/silk-wasm", "crates/silk-core-wasm", "crates/silk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/silk-wasm"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
