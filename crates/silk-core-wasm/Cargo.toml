[package]
name = "silk-core-wasm"
description = "Dependency-free WebAssembly core for the SILK v3 decoder (no bindgen toolchain required)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "silk_core_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
silk-decoder = { path = "../silk-decoder" }
