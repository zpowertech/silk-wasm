[package]
name = "silk-wasm"
description = "WebAssembly bindings: decode and play SILK v3 (.slk) audio in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "silk_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
silk-decoder = { path = "../silk-decoder" }
wasm-bindgen = "0.2"
